 return `<h2>Матеріали</h2><div class=mut>Підручники відкриваються, файли завантажуються</div><h3>Підручники</h3><div class=bk>${D.books.map((b,i)=>`<a class=card style="--i:${i}" target=_blank rel=noopener href="${ok(b.u)}"><div class=cv>${b.p?`<img src="${e(b.p)}" alt="">`:ico('book')}</div><b>${e(b.t)}</b></a>`).join('')||'<p class=mut>Поки порожньо</p>'}</div><h3>Файли</h3>${D.files.map((f,i)=>`<a class="card lk" style="--i:${i}" download target=_blank rel=noopener href="${ok(dl(f.u))}"><div class=ic style="--h:160">${ico('file')}</div><b>${e(f.t)}</b><span class=ar>${ico('dwn')}</span></a>`).join('')||'<p class=mut>Поки порожньо</p>'}`;
}
function vHol(){
 return `<h2>${e(D.hol.n)}</h2><div class=mut>Просто для настрою 😄</div><div class="card big"><div class=cdn id=cdd>0</div><div class=mut style="margin:6px 0 0">днів залишилось</div></div><div class=g4>${[['h','годин'],['m','хвилин'],['s','секунд']].map(([k,l],i)=>`<div class="card sm" style="--i:${i+1}"><b id=cd${k}>00</b><small>${l}</small></div>`).join('')}</div><p class=mut id=cdt style="text-align:center;font-size:16px"></p>`;
}
function cnt(){const p=D.poll,c=Array(p.opts.length).fill(0);if(live)VT.forEach(d=>{if(d&&d.p==p.id&&c[d.o]!==undefined)c[d.o]++});else{const my=localStorage.getItem('mv'+p.id);if(my!==null&&c[my]!==undefined)c[my]++}return c}
function vVot(){
 const p=D.poll,my=localStorage.getItem('mv'+p.id),c=cnt(),tot=c.reduce((a,b)=>a+b,0);
 return `<h2>${e(p.q)}</h2><div class=mut>Натисни на варіант, щоб проголосувати. Можна змінити вибір.</div>`+p.opts.map((o,i)=>{const pc=tot?Math.round(c[i]/tot*100):0;return `<button class="card opt ${my==i?'mine':''}" style="--i:${i}" onclick="vote(${i})"><i style="--w:${pc}%"></i><span>${e(o)}</span><b>${pc}%</b></button>`}).join('')+`<p class=mut>Голосів: ${tot}${live?'':' · поки що лише на цьому пристрої'}</p>`;
}
const fbu=()=>D.fb.replace(/\/$/,'');
async function fbLoad(){if(!D.fb||tab!='vot'||adm)return;try{const j=await(await fetch(fbu()+'/votes/'+D.poll.id+'.json')).json()||{};VT=Object.values(j).map(o=>({p:D.poll.id,o}));live=1;if(tab=='vot'&&!adm)V()}catch(_){}}
setInterval(fbLoad,8000);
function vote(i){const p=D.poll;localStorage.setItem('mv'+p.id,i);if(D.fb)fetch(fbu()+'/votes/'+p.id+'/'+dev+'.json',{method:'PUT',body:JSON.stringify(i)}).then(fbLoad).catch(()=>{});else if(live&&uid){window._db.collection('votes').doc(uid).set({p:p.id,o:i}).catch(()=>{})}V()}
function stat(){
 const n=new Date(),w=(n.getDay()+6)%7,m=n.getHours()*60+n.getMinutes();if(w>4)return'Вихідні 😴';
 const L=D.schedule[w]||[];let nx=null;
 for(let i=0;i<L.length;i++){const b=D.bells[i];if(!b||!b.a)continue;if(m>=mm(b.a)&&m<mm(b.b))return`${i+1} урок · ${L[i].s} · ще ${mm(b.b)-m} хв`;if(m<mm(b.a)&&!nx)nx=[i,mm(b.a)-m]}
 return nx?`Перерва · далі ${L[nx[0]].s} за ${nx[1]} хв`:'Уроки на сьогодні закінчились';
}
function tick(){
 const n=new Date(),s=$('#st');if(s)s.textContent=stat();const k=$('#clk');if(k)k.textContent=pad(n.getHours())+':'+pad(n.getMinutes());
 if(!$('#cdd'))return;const df=new Date(D.hol.d)-n;
 if(df<=0){$('#cdd').textContent='0';$('#cdt').textContent='Канікули почались! 🥳';return}
 const d=Math.floor(df/864e5);$('#cdd').textContent=d;$('#cdh').textContent=pad(Math.floor(df%864e5/36e5));$('#cdm').textContent=pad(Math.floor(df%36e5/6e4));$('#cds').textContent=pad(Math.floor(df%6e4/1e3));
 $('#cdt').textContent=d>60?'Ще далеко 😅':d>14?'Тримаємось 💪':d>3?'Вже зовсім скоро 👀':'ВЖЕ ВОНО!!! 🔥';
}
setInterval(tick,1000);

/* адмінка */
function tap(){clearTimeout(tt);if(++tc>=10){tc=0;ask()}tt=setTimeout(()=>tc=0,2500)}
function ask(){$('#adm').innerHTML=`<div class=modal onclick="if(event.target==this)$('#adm').innerHTML=''"><div class=mc><b>🔐 Вхід в адмінку</b><input id=pw type=password placeholder="Пароль" onkeydown="if(event.key=='Enter')chk()"><button onclick="chk()">Увійти</button></div></div>`;setTimeout(()=>$('#pw').focus(),50)}
function chk(){if($('#pw').value==='admin123'){adm=1;A()}else{const m=$('.mc');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');$('#pw').value=''}}
const get=p=>p.split('.').reduce((o,k)=>o[k],D);
function setp(p,v){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v}
const blank=p=>p.startsWith('schedule')?{s:'',r:''}:{bells:{a:'',b:''},teachers:{n:'',s:'',r:'',p:''},books:{t:'',u:'',p:''},files:{t:'',u:''}}[p];
function rows(p,f,ph){return get(p).map((r,i)=>`<div class=row>${ph?`<label class=ph>${r.p?`<img src="${e(r.p)}" alt="">`:ico('cam')}<input type=file accept="image/*" hidden onchange="pic(this,'${p}.${i}.p')"></label>`:''}${f.map(([k,ph,t])=>t=='pick'?PK(p,i,k,r,ph):`<input data-p="${p}.${i}.${k}" type="${t||'text'}" placeholder="${ph}" value="${e(r[k])}">`).join('')}<button class=x onclick="del('${p}',${i})">✕</button></div>`).join('')+`<button class=add onclick="add('${p}')">+ Додати</button>`}
function pic(i,p){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,260/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);setp(p,c.toDataURL('image/jpeg',.78));A();R()};m.src=r.result};r.readAsDataURL(f)}
const CAT=[['Мови та література',['Українська мова','Українська література','Англійська мова','Німецька мова','Зарубіжна література']],['Математика та інформатика',['Математика','Алгебра','Геометрія','Інформатика']],['Природничі науки',['Фізика','Хімія','Біологія','Географія','Природознавство']],['Суспільні науки',['Історія України','Всесвітня історія','Громадянська освіта','Економіка']],['Мистецтво, спорт, інше',['Фізкультура','Музичне мистецтво','Образотворче мистецтво','Технології','Захист України']]];
const PK=(p,i,k,r,ph)=>{const v=r[k],c=sic(v);return `<button class=pk onclick="pk('${p}.${i}.${k}')">${v?`<span class=ic style="--h:${c[2]}">${ico(c[1])}</span>${e(v)}`:`<span class=mut style="margin:0">${ph}</span>`}</button>`};
function pk(p){const cur=get(p);
 $('#adm').insertAdjacentHTML('beforeend',`<div class=modal style="z-index:40;align-items:end" onclick="if(event.target==this)this.remove()"><div class=pkr>${CAT.map(([c,a])=>`<h3>${c}</h3><div class=pg>${a.map(x=>{const[,ik,h]=sic(x);return `<button class="sq ${x==cur?'on':''}" data-s="${e(x)}" onclick="pv('${p}',this.dataset.s)"><span class=ic style="--h:${h}">${ico(ik)}</span>${e(x)}</button>`}).join('')}</div>`).join('')}<h3>Інше</h3><div class=row><input id=cs placeholder="Свій предмет"><button class=add style="width:auto;margin:0;padding:0 18px" onclick="pv('${p}',$('#cs').value)">ОК</button></div><button class=add onclick="pv('${p}','')">Очистити (вікно)</button></div></div>`)}
function pv(p,v){setp(p,v.trim());A();R()}
function add(p){get(p).push(blank(p));A();R()}
function del(p,i){get(p).splice(i,1);A();R()}
function AB(){
 if(at=='sch')return DN.map((d,i)=>`<h3>${d}</h3>`+rows('schedule.'+i,[['s','Обрати предмет','pick'],['r','Каб.']])).join('');
 if(at=='bel')return rows('bells',[['a','Початок','time'],['b','Кінець','time']]);
 if(at=='tea')return rows('teachers',[['n','Прізвище та ім’я'],['s','Обрати предмет','pick'],['r','Каб.']],1);
 if(at=='bk')return rows('books',[['t','Назва підручника'],['u','Посилання https://…']],1);
 if(at=='fl')return rows('files',[['t','Назва файлу'],['u','Посилання на файл']]);
 return `<h3>Клас</h3><input data-p="cls" value="${e(D.cls)}"><h3>Канікули</h3><div class=row><input data-p="hol.n" value="${e(D.hol.n)}"></div><div class=row><input data-p="hol.d" type="datetime-local" value="${e(D.hol.d)}"></div><h3>Голосування</h3><div class=row><input data-p="poll.q" value="${e(D.poll.q)}"></div>${D.poll.opts.map((o,i)=>`<div class=row><input data-p="poll.opts.${i}" value="${e(o)}"><button class=x onclick="del('poll.opts',${i})">✕</button></div>`).join('')}<button class=add onclick="D.poll.opts.push('');A();R()">+ Варіант</button><button class=add onclick="D.poll.id=String(Date.now());VT=[];A();R();toast('Нове голосування — голоси обнулено')">Нове голосування (обнулити голоси)</button><h3>Збереження для всіх (GitHub)</h3><div class=mut>Токен зберігається лише в цьому браузері</div><input placeholder="користувач/репозиторій" value="${e(G.r)}" oninput="gh('r',this.value)"><div class=row><input placeholder="файл (index.html)" value="${e(G.f)}" oninput="gh('f',this.value)"><input placeholder="гілка (main)" value="${e(G.b)}" oninput="gh('b',this.value)"></div><input type=password placeholder="GitHub токен" value="${e(G.t)}" oninput="gh('t',this.value)"><h3>Голосування для всіх (Firebase)</h3><input data-p="fb" placeholder="https://назва-default-rtdb.firebaseio.com" value="${e(D.fb)}">`;
}
function A(){const sc=($('.body')||{}).scrollTop||0,t=[['sch','Розклад'],['bel','Дзвінки'],['tea','Вчителі'],['bk','Книги'],['fl','Файли'],['oth','Інше']];
 $('#adm').innerHTML=adm?`<div class=sheet><div class=sh><b>⚙️ Адмінка</b><button class=x onclick="adm=0;A()">✕</button></div><div class=pills>${t.map(([k,n])=>`<button class="pill ${k==at?'on':''}" onclick="at='${k}';A()">${n}</button>`).join('')}</div><div class=body>${AB()}</div><button class=save onclick="save()">Зберегти й опублікувати</button></div>`:'';const bd=$('.body');if(bd)bd.scrollTop=sc}
document.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(p){setp(p,ev.target.value);if(!adm)return;clearTimeout(window._rt);window._rt=setTimeout(R,300)}});
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2800)}
async function ghPush(n=1){
 const u=`https://api.github.com/repos/${G.r}/contents/${G.f||'index.html'}`,br=G.b||'main',h={Authorization:'Bearer '+G.t,Accept:'application/vnd.github+json'};
 const r=await fetch(u+'?ref='+br+'&t='+Date.now(),{headers:h,cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status+' — перевір репозиторій, файл і токен');
 const j=await r.json(),old=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
 const nd=JSON.stringify(D).replace(/</g,'\\u003c'),out=old.replace(/(<script id="d" type="application\/json">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+nd+y);
 let bin='';new TextEncoder().encode(out).forEach(c=>bin+=String.fromCharCode(c));
 const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Оновлення сайту',content:btoa(bin),sha:j.sha,branch:br})});
 if(p.status==409&&n)return ghPush(0);
 if(!p.ok){let m='';try{m=(await p.json()).message}catch(_){}throw Error('GitHub '+p.status+' [v3]: '+m)}
}
async function save(){
 D.v=Date.now();let msg='Збережено лише на цьому пристрої';try{localStorage.setItem('cls',JSON.stringify(D))}catch(_){}
 try{
  if(G.r&&G.t){await ghPush();msg='Збережено для всіх ✓ Сайт оновиться за ~1 хв'}
  else if(window.claude){const a=await claude.use('artifact');if(a){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#adm').innerHTML='';c.querySelector('#d').textContent=JSON.stringify(D).replace(/</g,'\\u003c');await a.publish('<!doctype html>\n'+c.outerHTML);msg='Опубліковано ✓'}}
 }catch(x){msg='Помилка: '+(x.message||x)}
 toast(msg);
}
R();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),db=await claude.use('db');if(u&&db&&!D.fb){uid=await u.id();window._db=db;db.collection('votes').onSnapshot(s=>{VT=s.docs.map(d=>d.data());live=1;if(tab=='vot'&&!adm)V()})}}catch(_){}})();
</script>
